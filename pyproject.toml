[project]
name = "modelo-electoral-29n"
version = "1.1.0"
description = "Modelo del Congreso para el 29-N de 2026: media de encuestas, capa autonómica, reparto provincial y Monte Carlo de escaños con D'Hondt."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "plotly>=5.24", "streamlit>=1.50", "starlette>=0.40", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["resultados"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear y pyupgrade (sin isort: los imports siguen el estilo compacto del proyecto)
select = ["E", "W", "F", "B", "UP"]
ignore = [
    "E702",  # varias asignaciones cortas en una línea con ';' (estilo deliberado en las cuentas)
    "B905",  # zip() sin strict=: las longitudes ya se comprueban donde importan
]

[tool.ruff.lint.per-file-ignores]
# Hojas de estilo CSS de los PDF escritas como texto: las reglas largas se leen mejor en una línea
"docs/pdf/construir.py" = ["E501"]
